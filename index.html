<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Czarna Perła — Panel</title>
  <style>
    :root {
      --bg: #07090d;
      --panel: rgba(15, 20, 29, .88);
      --text: #f4f6f8;
      --gold: #f3a63b;
      --green: #10d49a;
      --red: #ff6262;
      --line: rgba(111, 126, 148, .30);
    }
    body {
      margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; align-items: center;
    }
    .container { width: 100%; max-width: 800px; }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 24px; margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1, h2, h3 { color: var(--gold); margin-top: 0; }
    .hidden { display: none !important; }
    label { display: block; margin-top: 15px; font-size: 14px; font-weight: bold; color: #aeb7c5;}
    input {
      width: 100%; padding: 12px; margin-top: 5px; box-sizing: border-box;
      background: rgba(0,0,0,0.5); border: 1px solid var(--line); color: white; border-radius: 6px;
    }
    input:focus { border-color: var(--gold); outline: none; }
    .btn {
      width: 100%; padding: 14px; margin-top: 20px; font-weight: bold; border: none; border-radius: 6px;
      background: var(--gold); color: black; cursor: pointer; font-size: 16px;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn-red { background: var(--red); color: white; }
    .btn-small { width: auto; padding: 8px 12px; margin: 2px; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th, td { padding: 10px; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--gold); }
    .status-ok { color: var(--green); font-weight: bold; }
    .status-err { color: var(--red); font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Czarna Perła</h1>
    
    <!-- LOGOWANIE -->
    <div id="login-panel" class="card">
      <h2>Logowanie do panelu</h2>
      <p style="color: #aeb7c5;">Wpisz swoje Telegram ID, aby uzyskać dostęp do ustawień.</p>
      <input type="number" id="login-id" placeholder="np. 123456789">
      <button class="btn" onclick="login()">Wejdź do panelu</button>
    </div>

    <!-- PANEL INWESTORA -->
    <div id="dashboard-panel" class="card hidden">
      <h2>Panel Inwestora</h2>
      <p>Witaj, <strong id="dash-name" style="color: var(--gold);"></strong>!</p>
      <p style="color: #aeb7c5;">Plan: <span id="dash-plan" style="color: white;"></span></p>
      <p style="color: #aeb7c5;">Ważność do: <span id="dash-sub" style="color: white;"></span></p>
      <p style="color: #aeb7c5;">Status API: <span id="dash-api"></span></p>
      
      <hr style="border: 0; border-top: 1px solid var(--line); margin: 20px 0;">
      
      <h3>Ustawienia Bitget</h3>
      <label>API Key
        <input type="text" id="api-key" placeholder="Wklej API Key z Bitget">
      </label>
      <label>API Secret
        <input type="password" id="api-secret" placeholder="Wklej API Secret">
      </label>
      <label>Passphrase
        <input type="password" id="api-passphrase" placeholder="Wklej Passphrase">
      </label>
      <div style="display: flex; gap: 15px;">
        <div style="flex: 1;">
          <label>Dźwignia (x)
            <input type="number" id="leverage" placeholder="20">
          </label>
        </div>
        <div style="flex: 1;">
          <label>Margin na pozycję (USDT)
            <input type="number" id="margin" step="0.1" placeholder="4.0">
          </label>
        </div>
      </div>
      
      <button class="btn" onclick="saveSettings()">Zapisz i podłącz API</button>
      <button class="btn btn-red" onclick="logout()" style="margin-top: 10px;">Wyloguj się</button>
    </div>

    <!-- MOSTEK KAPITAŃSKI (ADMIN) -->
    <div id="admin-panel" class="card hidden">
      <h2>Mostek Kapitański</h2>
      <button class="btn btn-small" onclick="loadUsers()" style="margin-bottom: 10px;">Odśwież listę użytkowników</button>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>ID Telegram</th>
              <th>Imię w panelu</th>
              <th>Ważność licencji</th>
              <th>Status Bota</th>
              <th>Uprawnienia</th>
            </tr>
          </thead>
          <tbody id="admin-tbody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // Zmień poniższy URL na IP swojego serwera, jeśli strona HTML leży na innym hostingu (np. GitHubie).
    // Jeżeli otwierasz ten plik bezpośrednio, możesz wpisać swój publiczny adres IP np. "http://62.131.59.133:8000"
    const API_URL = "http://127.0.0.1:8000"; 
    
    let currentUserId = null;
    let isAdmin = false;

    const byId = id => document.getElementById(id);

    async function login() {
      const id = byId("login-id").value.trim();
      if (!id) return alert("Podaj prawidłowe Telegram ID!");

      try {
        const res = await fetch(`${API_URL}/api/dashboard/${id}`);
        const data = await res.json();

        if (data.status === "success") {
          currentUserId = data.telegram_id;
          isAdmin = data.is_admin;

          byId("login-panel").classList.add("hidden");
          byId("dashboard-panel").classList.remove("hidden");

          byId("dash-name").textContent = data.custom_name || data.username;
          byId("dash-plan").textContent = data.plan_name;
          byId("dash-sub").textContent = data.subscription_end_date;
          
          if (data.api_connected) {
            byId("dash-api").textContent = "✅ Aktywne (Podłączono)";
            byId("dash-api").className = "status-ok";
          } else {
            byId("dash-api").textContent = "❌ Brak podłączonych kluczy";
            byId("dash-api").className = "status-err";
          }

          byId("leverage").value = data.leverage || 20;
          byId("margin").value = data.margin || 4.0;

          if (isAdmin) {
            byId("admin-panel").classList.remove("hidden");
            loadUsers();
          }
        } else {
          alert("Nie udało się pobrać danych z bazy.");
        }
      } catch (err) {
        alert("Błąd połączenia. Upewnij się, że serwer Pythona (uvicorn) działa.");
      }
    }

    function logout() {
      currentUserId = null;
      isAdmin = false;
      byId("login-id").value = "";
      byId("login-panel").classList.remove("hidden");
      byId("dashboard-panel").classList.add("hidden");
      byId("admin-panel").classList.add("hidden");
      
      byId("api-key").value = "";
      byId("api-secret").value = "";
      byId("api-passphrase").value = "";
    }

    async function saveSettings() {
      const payload = {
        telegram_id: currentUserId,
        api_key: byId("api-key").value.trim(),
        api_secret: byId("api-secret").value.trim(),
        api_passphrase: byId("api-passphrase").value.trim(),
        leverage: parseInt(byId("leverage").value) || 20,
        margin: parseFloat(byId("margin").value) || 4.0
      };

      try {
        const res = await fetch(`${API_URL}/api/save_settings`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        alert(data.message || "Zapisano pomyślnie.");
        login(); // Szybkie odświeżenie danych z serwera
      } catch (err) {
        alert("Błąd podczas zapisywania danych do API.");
      }
    }

    async function loadUsers() {
      try {
        const res = await fetch(`${API_URL}/api/admin/users`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ admin_id: currentUserId })
        });
        const data = await res.json();

        if (data.status === "success") {
          const tbody = byId("admin-tbody");
          tbody.innerHTML = "";
          data.users.forEach(u => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td style="font-family: monospace;">${u.telegram_id}</td>
              <td>
                <input type="text" id="name-${u.telegram_id}" value="${u.custom_name}" style="width: 120px; padding: 6px; margin: 0;">
                <button class="btn-small" onclick="updateName(${u.telegram_id})">Zapisz</button>
              </td>
              <td style="color: #aeb7c5;">${u.sub_end}</td>
              <td>
                <button class="btn-small ${u.bot_active ? 'btn-red' : ''}" onclick="toggleBot(${u.telegram_id}, ${!u.bot_active})">
                  ${u.bot_active ? 'Wyłącz bota' : 'Włącz bota'}
                </button>
              </td>
              <td>
                <button class="btn-small ${u.is_admin ? 'btn-red' : ''}" onclick="toggleAdmin(${u.telegram_id}, ${!u.is_admin})">
                  ${u.is_admin ? 'Zabierz Admina' : 'Nadaj Admina'}
                </button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        }
      } catch (err) {
        alert("Błąd przy ładowaniu listy z bazy danych.");
      }
    }

    async function toggleBot(targetUser, isActive) {
      await fetch(`${API_URL}/api/admin/toggle_bot`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ admin_id: currentUserId, target_user: targetUser, active: isActive })
      });
      loadUsers();
    }

    async function toggleAdmin(targetUser, isAdminRole) {
      await fetch(`${API_URL}/api/admin/toggle_admin`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ admin_id: currentUserId, target_user: targetUser, is_admin: isAdminRole })
      });
      loadUsers();
    }

    async function updateName(targetUser) {
      const name = byId(`name-${targetUser}`).value;
      await fetch(`${API_URL}/api/admin/update_name`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ admin_id: currentUserId, target_user: targetUser, custom_name: name })
      });
      alert("Imię zaktualizowane poprawnie!");
    }
  </script>
</body>
</html>
